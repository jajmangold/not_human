[project]
name = "musetalk-voice-agent"
version = "0.0.0"
description = "LiveKit voice agent: self-hosted Whisper STT, qwen27b LLM, Kokoro TTS "
requires-python = ">=3.10"
dependencies = [
    "livekit-agents>=1.0.0",
    "livekit-plugins-openai>=1.0.0",
    "livekit-plugins-silero>=1.0.0",
    "aiohttp>=3.9.0",
    "python-dotenv>=1.0.0",
    "opencv-python-headless>=4.9.0",
    "numpy>=1.26.0",
    "pillow>=10.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
